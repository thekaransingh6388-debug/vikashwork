  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0b0f17;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* subtle background pattern - no faces, no stock photos */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 200, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 200, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 2;
      max-width: 520px;
      width: 100%;
      background: rgba(18, 24, 36, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 200, 0.2);
      border-radius: 36px;
      padding: 36px 28px 40px;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 255, 200, 0.1) inset;
      text-align: center;
      transition: border-color 0.3s;
    }

    .logo-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 24px;
      border: 2px solid rgba(0, 255, 200, 0.5);
      padding: 6px;
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
    }

    /* BLINKING NAME – exactly as requested */
    .blink-name {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #00ffc3;
      text-shadow: 0 0 8px #00ffc3, 0 0 20px rgba(0, 255, 195, 0.6);
      animation: blinkAnim 1.2s step-start infinite;
      margin: 16px 0 8px;
      line-height: 1.2;
      word-break: break-word;
    }

    @keyframes blinkAnim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .tagline {
      color: #a0b5cc;
      font-size: 1rem;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      font-weight: 500;
      background: rgba(0, 255, 200, 0.08);
      display: inline-block;
      padding: 6px 18px;
      border-radius: 40px;
      border: 1px solid rgba(0, 255, 200, 0.2);
      margin-bottom: 28px;
    }

    .cta-button {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #00ffc3 0%, #00b8a0 100%);
      border: none;
      border-radius: 80px;
      padding: 18px 20px;
      font-size: 1.4rem;
      font-weight: 700;
      color: #0b0f17;
      text-decoration: none;
      letter-spacing: 0.5px;
      box-shadow: 0 12px 30px -6px rgba(0, 255, 195, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      transition: all 0.25s ease;
      cursor: pointer;
      text-align: center;
      margin: 8px 0 18px;
    }

    .cta-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 22px 40px -8px #00ffc3, 0 0 0 2px rgba(255, 255, 255, 0.2) inset;
      background: linear-gradient(135deg, #1affd0 0%, #00ccb0 100%);
    }

    .cta-button:active {
      transform: translateY(1px);
      box-shadow: 0 8px 20px -4px #00ffc3;
    }

    .meta-note {
      font-size: 0.75rem;
      color: #5a6c7e;
      letter-spacing: 0.4px;
      margin-bottom: 20px;
      opacity: 0.8;
    }

    .ad-managed {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #9aaec2;
      background: rgba(255, 255, 255, 0.02);
      padding: 12px 14px;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: inline-block;
      font-weight: 400;
      letter-spacing: 0.5px;
      backdrop-filter: blur(4px);
    }

    .ad-managed span {
      color: #00ffc3;
      font-weight: 600;
    }

    /* no face, no person, no clickable image */
    .legal-note {
      margin-top: 22px;
      font-size: 0.65rem;
      color: #3c4c5e;
      letter-spacing: 0.3px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card {
        padding: 28px 18px 32px;
        border-radius: 28px;
      }
      .blink-name {
        font-size: 1.7rem;
      }
      .cta-button {
        font-size: 1.15rem;
        padding: 16px 12px;
      }
      .logo-img {
        width: 80px;
        height: 80px;
      }
    }

    /* Disable image drag / click effect - no face clicks */
    img {
      user-drag: none;
      -webkit-user-drag: none;
      user-select: none;
      -moz-user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      pointer-events: none; /* ensures no click on logo */
    }

    /* But the button and link are clickable */
    .cta-button {
      pointer-events: auto;
    }
